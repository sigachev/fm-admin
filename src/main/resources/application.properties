server.port=8090
spring.application.name=fm-admin

# ── Disable Spring Boot default datasource + JPA auto-config ──────────────────
# Required for dual-datasource setup; both are configured manually in DataSourceConfig
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ── Main DB (finmates — users, admin_news) ─────────────────────────────────────
datasource.main.jdbc-url=jdbc:postgresql://localhost:5432/main
datasource.main.username=${DB_USERNAME:postgres}
datasource.main.password=${DB_PASSWORD:postgres}
datasource.main.driver-class-name=org.postgresql.Driver

# ── Crypto DB (crypto — portfolios, trades, positions) ─────────────────────────
datasource.crypto.jdbc-url=jdbc:postgresql://localhost:5432/crypto
datasource.crypto.username=${DB_USERNAME:postgres}
datasource.crypto.password=${DB_PASSWORD:postgres}
datasource.crypto.driver-class-name=org.postgresql.Driver

# ── Aggregator DB (crypto_data — assets, prices) ────────────────────────────
datasource.aggregator.jdbc-url=jdbc:postgresql://localhost:5432/crypto_data
datasource.aggregator.username=${DB_USERNAME:postgres}
datasource.aggregator.password=${DB_PASSWORD:postgres}
datasource.aggregator.driver-class-name=org.postgresql.Driver

# ── Keycloak JWT ───────────────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/finmates

# ── Keycloak Admin (for password reset) ────────────────────────────────────────
keycloak.auth-server-url=http://localhost:8180
keycloak.realm=finmates
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:}

# ── Aggregator (internal client for source health) ────────────────────────────────
aggregator.url=http://localhost:8088

# ── Internal service clients (moderation orchestration) ─────────────────────────
fm-admin.fm-social.base-url=${FM_SOCIAL_URL:http://localhost:8091}
fm-admin.fm-main.base-url=${FM_MAIN_URL:http://localhost:8081}
fm-admin.internal-secret=${INTERNAL_SHARED_SECRET:dev-local-secret}

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Swagger UI ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/ui
springdoc.api-docs.path=/v3/api-docs

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.finmates.admin=INFO

# ── HikariCP Connection Pool ──────────────────────────────────────────────
# Reduce pool size to prevent "too many clients" errors on shared PostgreSQL
# NOTE: spring.datasource.hikari.* below was dead config — DataSourceAutoConfiguration is
# excluded in this service, so those properties bound to nothing. Per-DS pool sizing is now
# defined under datasource.{main,crypto,aggregator}.hikari.* which @ConfigurationProperties
# binds directly into each HikariDataSource bean in DataSourceConfig.
#
# fm-admin is low-traffic; 3 connections per DS is generous; min-idle=0 lets pools shrink
# fully between admin requests (trades cold-connection latency on first request after idle —
# acceptable here).

datasource.main.hikari.maximum-pool-size=3
datasource.main.hikari.minimum-idle=0
datasource.main.hikari.connection-timeout=10000
datasource.main.hikari.idle-timeout=600000
datasource.main.hikari.max-lifetime=1800000

datasource.crypto.hikari.maximum-pool-size=3
datasource.crypto.hikari.minimum-idle=0
datasource.crypto.hikari.connection-timeout=10000
datasource.crypto.hikari.idle-timeout=600000
datasource.crypto.hikari.max-lifetime=1800000

datasource.aggregator.hikari.maximum-pool-size=3
datasource.aggregator.hikari.minimum-idle=0
datasource.aggregator.hikari.connection-timeout=10000
datasource.aggregator.hikari.idle-timeout=600000
datasource.aggregator.hikari.max-lifetime=1800000

# ── Spring graceful shutdown ───────────────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
