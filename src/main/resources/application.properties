server.port=8090
spring.application.name=fm-admin

# ── Disable Spring Boot default datasource + JPA auto-config ──────────────────
# Required for dual-datasource setup; both are configured manually in DataSourceConfig
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ── Main DB (finmates — users, admin_news) ─────────────────────────────────────
datasource.main.jdbc-url=jdbc:postgresql://localhost:5432/main
datasource.main.username=${DB_USERNAME:postgres}
datasource.main.password=${DB_PASSWORD:postgres}
datasource.main.driver-class-name=org.postgresql.Driver

# ── Crypto DB (crypto — portfolios, trades, positions) ─────────────────────────
datasource.crypto.jdbc-url=jdbc:postgresql://localhost:5432/crypto
datasource.crypto.username=${DB_USERNAME:postgres}
datasource.crypto.password=${DB_PASSWORD:postgres}
datasource.crypto.driver-class-name=org.postgresql.Driver

# ── Keycloak JWT ───────────────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/finmates

# ── Keycloak Admin (for password reset) ────────────────────────────────────────
keycloak.auth-server-url=http://localhost:8180
keycloak.realm=finmates
keycloak.admin.username=admin
keycloak.admin.password=

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Swagger UI ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/ui
springdoc.api-docs.path=/v3/api-docs

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.finmates.admin=INFO
