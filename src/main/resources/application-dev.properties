# Dev profile — connects to the shared dev PostgreSQL at finmates.com
# DB name is 'main' (finmates-main DB) and 'crypto' (finmates-crypto DB)

datasource.main.jdbc-url=jdbc:postgresql://finmates.com:5432/main
datasource.main.username=user
datasource.main.password=${DB_PASSWORD:Int6859351!}

datasource.crypto.jdbc-url=jdbc:postgresql://finmates.com:5432/crypto
datasource.crypto.username=user
datasource.crypto.password=${DB_PASSWORD:Int6859351!}

datasource.aggregator.jdbc-url=jdbc:postgresql://finmates.com:5432/crypto_aggregator
datasource.aggregator.username=user
datasource.aggregator.password=${DB_PASSWORD:Int6859351!}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.finmates.com/realms/finmates

keycloak.auth-server-url=https://auth.finmates.com
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:1111}

aggregator.url=http://localhost:8088

# ── HikariCP Connection Pool ──────────────────────────────────────────────
# Reduce pool size to prevent "too many clients" errors on shared PostgreSQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
