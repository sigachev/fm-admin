# Dev profile — connects to the shared dev PostgreSQL at finmates.com
# DB name is 'main' (finmates-main DB) and 'crypto' (finmates-crypto DB)

datasource.main.jdbc-url=jdbc:postgresql://finmates.com:5432/main
datasource.main.username=user
datasource.main.password=${DB_PASSWORD:Int6859351!}

datasource.crypto.jdbc-url=jdbc:postgresql://finmates.com:5432/crypto
datasource.crypto.username=user
datasource.crypto.password=${DB_PASSWORD:Int6859351!}

datasource.aggregator.jdbc-url=jdbc:postgresql://finmates.com:5432/crypto_data
datasource.aggregator.username=user
datasource.aggregator.password=${DB_PASSWORD:Int6859351!}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.finmates.com/realms/finmates

keycloak.auth-server-url=https://auth.finmates.com
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:1111}

aggregator.url=http://localhost:8088

# Prometheus is cluster-internal; reaching it from local dev needs a port-forward:
#   kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090
# Then uncomment the next line. Leaving blank triggers the ADR-0001 degraded path
# on /api/admin/services/cluster-alerts — same code path the panel renders in
# the unhappy case, so dev experience matches the prod degraded state by default.
prometheus.url=
#prometheus.url=http://localhost:9090

# ── Internal service clients (dev) ─────────────────────────────────────────────
fm-admin.fm-social.base-url=http://localhost:8091
fm-admin.fm-main.base-url=http://localhost:8081
fm-admin.internal-secret=${INTERNAL_SHARED_SECRET:dev-local-secret}

# ── HikariCP Connection Pool ──────────────────────────────────────────────
# fm-admin connects to 3 DBs: aggressive pooling to prevent "too many clients"
# These settings apply to all three datasources (main, crypto, aggregator)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000
