# Read-only ServiceAccount for fm-admin's pod-IP -> service resolver
# (services dashboard, Phase 1b). Bound to the pods-reader Role via
# k8s-rbac-rolebinding.yaml; only used by admin-panel via
# spec.template.spec.serviceAccountName (see k8s-rbac-deployment-patch.md).
#
# Scope: namespace `dev` only. No cluster-scoped grants.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fm-admin-watcher
  namespace: dev
  labels:
    app: admin-panel
    purpose: pod-resolver
