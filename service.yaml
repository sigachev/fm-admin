---
# Admin API Service
# Exposes fm-admin deployment on port 8090
apiVersion: v1
kind: Service
metadata:
  name: fm-admin
  namespace: dev
  labels:
    app: fm-admin
    component: admin-api
spec:
  type: ClusterIP
  selector:
    app: fm-admin
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP